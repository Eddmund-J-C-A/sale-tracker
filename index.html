<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Tracker</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2a2622;--mu:#7a726a;--ac:#8a5a3c;--ac2:#f1e6dc;--bd:#e4ddd5;--rd:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#26221f;--tx:#f0ebe5;--mu:#a39a90;--ac:#d4a07a;--ac2:#3a2e26;--bd:#3a3430;--rd:#f2877f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
#app{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0}h1{font-size:22px}h2{font-size:18px}h3{font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input,select{min-width:0}textarea{width:100%}
button{cursor:pointer;background:var(--ac2)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}button.l{border:0;background:none;padding:2px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{cursor:pointer}.pc:hover{border-color:var(--ac)}
.chip{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0}
.mu{color:var(--mu);font-size:13px}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}.st b{display:block;font-size:19px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.msg{background:var(--ac2);border:1px solid var(--ac);border-radius:8px;padding:8px 12px;margin:8px 0}
svg text{fill:var(--mu);font-size:11px}
button{touch-action:manipulation}.big{min-height:46px;padding:8px 14px}
.tile{position:relative;min-height:104px;border-radius:14px;text-align:left;font-size:17px;display:flex;flex-direction:column;gap:4px;user-select:none;-webkit-user-select:none}.tile:active{transform:scale(.97)}
.tile.on{border-color:var(--ac);background:var(--ac2)}.badge{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border-radius:99px;min-width:28px;text-align:center;font-weight:700;padding:2px 8px}
.cart{position:sticky;bottom:8px;box-shadow:0 -4px 18px rgba(0,0,0,.2)}.go{width:100%;font-size:18px;min-height:56px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=new TextEncoder(),D=new TextDecoder(),sub=crypto.subtle,RSA={name:'RSA-OAEP',hash:'SHA-256'};
const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=async(p,salt)=>{const m=await sub.importKey('raw',T.encode(p),'PBKDF2',false,['deriveKey']);return sub.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const enc=async(k,o)=>{const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await sub.encrypt({name:'AES-GCM',iv},k,T.encode(JSON.stringify(o))))}};
const dec=async(k,e)=>JSON.parse(D.decode(await sub.decrypt({name:'AES-GCM',iv:ub(e.iv)},k,ub(e.ct))));
const wrap=async(wk,jwk)=>b64(await sub.encrypt({name:'RSA-OAEP'},await sub.importKey('jwk',jwk,RSA,false,['encrypt']),await sub.exportKey('raw',wk)));
const unwrap=async(w)=>sub.importKey('raw',await sub.decrypt({name:'RSA-OAEP'},S.priv,ub(w)),'AES-GCM',true,['encrypt','decrypt']);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},uid=()=>crypto.randomUUID().slice(0,8);
const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(n||0);
let cfg={repo:'',branch:'main',token:''};try{cfg={...cfg,...JSON.parse(localStorage.getItem('st_cfg')||'{}')}}catch(e){}
const S={user:null,priv:null,pub:null,wss:[],cur:0,open:null,st:0,cart:{},recent:[],ev:'',pay:'',slab:'',q:'',lab:'',sort:'name',msg:'',busy:0};

/* ---- GitHub contents API ---- */
const NETERR=e=>new Error('Could not reach GitHub ('+e.message+'). Open this file directly in your browser (download it, then double-click it, or host it on GitHub Pages) — previews inside chat apps block network access.');
async function gh(path,o={}){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(o.method?'':`?ref=${cfg.branch}`),{...o,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}}).catch(e=>{throw NETERR(e)});
 if(r.status===404){if(o.method)throw Object.assign(new Error('GitHub returned 404 — check the repo name, branch, and that the token has Contents read/write on this repo'),{status:404});return null}if(!r.ok){const e=new Error(r.status===401?'GitHub rejected the token':r.status===403?'Token lacks Contents access to this repo':'GitHub error '+r.status);e.status=r.status;throw e}return r.json()}
const getFile=async p=>{const j=await gh(p);return j&&{sha:j.sha,text:atob(j.content.replace(/\n/g,''))}};
const putFile=(p,text,sha,m)=>gh(p,{method:'PUT',body:JSON.stringify({message:m,content:btoa(text),branch:cfg.branch,...(sha?{sha}:{})})});

async function chk(){const h={Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'};
 if(!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo))throw new Error('Repo must look like owner/repo-name');if(!cfg.token)throw new Error('Paste your fine-grained token');
 let r=await fetch('https://api.github.com/repos/'+cfg.repo,{headers:h,cache:'no-store'}).catch(e=>{throw NETERR(e)});
 if(r.status===401)throw new Error('GitHub rejected the token (expired or mistyped)');
 if(!r.ok)throw new Error('Repo not found, or the token has no access to it. Check owner/repo and the token’s repository selection.');
 r=await fetch('https://api.github.com/repos/'+cfg.repo+'/branches/'+encodeURIComponent(cfg.branch),{headers:h,cache:'no-store'}).catch(e=>{throw NETERR(e)});
 if(!r.ok)throw new Error('Branch “'+cfg.branch+'” not found. If the repo is empty, add a README on GitHub first.')}
/* ---- workspaces ---- */
const W=()=>S.wss[S.cur];
async function persist(ws){const body={owner:ws.owner,members:ws.members,...await enc(ws.key,ws.data)};
 try{const r=await putFile(`store/ws/${ws.id}.json`,JSON.stringify(body),ws.sha,'update');ws.sha=r.content.sha}
 catch(e){if(e.status===409||e.status===422){await loadAll();throw new Error('Someone else changed this at the same time. Latest data was reloaded — please redo your last change.')}throw e}}
async function mkWs(name){const key=await sub.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
 const ws={id:uid(),key,owner:S.user,members:{[S.user]:await wrap(key,S.pub)},data:{name,products:[]},sha:null};await persist(ws);S.wss.push(ws);S.cur=S.wss.length-1}
async function loadAll(){const list=await gh('store/ws')||[];const out=[];
 await Promise.all(list.filter(f=>f.name.endsWith('.json')).map(async f=>{try{const x=await getFile(f.path),j=JSON.parse(x.text);if(!j.members[S.user])return;
  const key=await unwrap(j.members[S.user]);out.push({id:f.name.slice(0,-5),sha:x.sha,owner:j.owner,members:j.members,key,data:await dec(key,j)})}catch(e){}}));
 out.sort((a,b)=>(a.owner===S.user?0:1)-(b.owner===S.user?0:1)||a.id.localeCompare(b.id));S.wss=out;S.cur=Math.min(S.cur,Math.max(0,out.length-1))}

/* ---- actions ---- */
const go=async f=>{S.msg='';S.busy=1;render();try{await f()}catch(e){S.msg=e.message||String(e)}S.busy=0;render()};
const save=()=>persist(W());
const P=id=>W().data.products.find(p=>p.id===id);
const latest=p=>[...p.priceHistory].sort((a,b)=>a.d.localeCompare(b.d)).pop();
const A={
 auth(mode){cfg={repo:$('#repo').value.trim(),branch:$('#br').value.trim()||'main',token:$('#tok').value.trim()};
  const u=$('#usr').value.trim().toLowerCase(),pass=$('#pas').value,rem=$('#rem').checked;S.u0=u;
  try{localStorage.setItem('st_cfg',JSON.stringify(rem?cfg:{repo:cfg.repo,branch:cfg.branch}))}catch(e){}
  go(async()=>{await chk();if(!/^[a-z0-9_-]{3,32}$/.test(u))throw new Error('Username: 3–32 letters, numbers, - or _');if(pass.length<8)throw new Error('Passphrase needs at least 8 characters');
  const uf=await getFile(`store/users/${u}.json`);
  if(mode==='in'){if(!uf)throw new Error('No such account');const j=JSON.parse(uf.text);let pj;try{pj=await dec(await pw(pass,ub(j.salt)),j.priv)}catch(e){throw new Error('Wrong passphrase')}
   S.priv=await sub.importKey('jwk',pj,RSA,false,['decrypt']);S.pub=j.pub;S.user=u;await loadAll();if(!S.wss.length)await mkWs('My products')}
  else{if(uf)throw new Error('That username is taken');const salt=crypto.getRandomValues(new Uint8Array(16));
   const kp=await sub.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
   const pub=await sub.exportKey('jwk',kp.publicKey),priv=await enc(await pw(pass,salt),await sub.exportKey('jwk',kp.privateKey));
   await putFile(`store/users/${u}.json`,JSON.stringify({salt:b64(salt),pub,priv}),null,'new user');S.priv=kp.privateKey;S.pub=pub;S.user=u;await mkWs('My products')}})},
 out(){S.user=S.priv=null;S.wss=[];S.open=null;S.st=0;S.cart={};S.recent=[];render()},
 ws(i){S.cur=+i;S.open=null;S.cart={};S.recent=[];render()},
 newWs(){const n=prompt('Name for the new shared/private collection?');if(n)go(()=>mkWs(n))},
 share(){const u=(prompt('Username to share “'+W().data.name+'” with (they must have an account):')||'').trim().toLowerCase();if(!u)return;
  go(async()=>{const f=await getFile(`store/users/${u}.json`);if(!f)throw new Error('No account named '+u);const ws=W();ws.members[u]=await wrap(ws.key,JSON.parse(f.text).pub);await persist(ws);S.msg=u+' can now see and edit this collection.'})},
 rename(){const n=prompt('Rename collection',W().data.name);if(n){W().data.name=n;go(save)}},
 add(){const n=$('#n').value.trim();if(!n)return;const pr=+$('#pr').value||0;
  W().data.products.push({id:uid(),name:n,labels:$('#lb').value.split(',').map(s=>s.trim()).filter(Boolean),cost:+$('#co').value||0,priceHistory:pr?[{d:today(),p:pr}]:[],sales:[],notes:[]});go(save)},
 open(id){S.open=id;render();scrollTo(0,0)},back(){S.open=null;render()},
 del(){if(confirm('Delete this product and all its history?')){const w=W().data;w.products=w.products.filter(p=>p.id!==S.open);S.open=null;go(save)}},
 field(k){const p=P(S.open),v=$('#f_'+k).value;p[k]=k==='cost'?+v||0:v.trim()||p[k];go(save)},
 addLabel(){const p=P(S.open),v=$('#nl').value.trim();if(v&&!p.labels.includes(v)){p.labels.push(v);go(save)}},
 rmLabel(i){P(S.open).labels.splice(i,1);go(save)},
 sale(){const p=P(S.open),q=+$('#sq').value,pr=+$('#sp').value;if(!(q>0)||pr<0)return;p.sales.push({id:uid(),d:$('#sd').value||today(),q,p:pr,n:$('#sn').value.trim()});go(save)},
 rmSale(id){const p=P(S.open);p.sales=p.sales.filter(s=>s.id!==id);go(save)},
 price(){const p=P(S.open),v=+$('#hp').value,d=$('#hd').value||today();if(!(v>=0)||$('#hp').value==='')return;p.priceHistory=p.priceHistory.filter(h=>h.d!==d);p.priceHistory.push({d,p:v});go(save)},
 rmPrice(d){const p=P(S.open);p.priceHistory=p.priceHistory.filter(h=>h.d!==d);go(save)},
 note(){const t=$('#nt').value.trim();if(!t)return;P(S.open).notes.push({id:uid(),d:$('#nd').value||today(),t});go(save)},
 rmNote(id){const p=P(S.open);p.notes=p.notes.filter(n=>n.id!==id);go(save)},
 stOn(){S.st=1;S.cart={};S.slab='';try{S.ev=localStorage.getItem('st_ev')||S.ev}catch(e){}render();scrollTo(0,0)},
 stOff(){S.st=0;render()},
 ev(v){S.ev=v;try{localStorage.setItem('st_ev',v)}catch(e){}},
 slab(l){S.slab=l;render()},
 pay(m){S.pay=S.pay===m?'':m;render()},
 tap(id){const c=S.cart;(c[id]=c[id]||{q:0,p:st(P(id)).cur}).q++;navigator.vibrate&&navigator.vibrate(15);render()},
 qty(id,d){const x=S.cart[id];x.q+=d;if(x.q<1)delete S.cart[id];render()},
 cp(id){const v=prompt('Price each',S.cart[id].p);if(v!==null&&v.trim()!==''&&+v>=0){S.cart[id].p=+v;render()}},
 clr(){S.cart={};render()},
 log(){const ids=Object.keys(S.cart).filter(i=>P(i));if(!ids.length)return;const n=[S.ev.trim(),S.pay].filter(Boolean).join(' · '),d=today(),made=[];let t=0;
  go(async()=>{ids.forEach(i=>{const x=S.cart[i],sl={id:uid(),d,q:x.q,p:x.p,n};P(i).sales.push(sl);made.push([i,sl.id]);t+=x.q*x.p});
   try{await save()}catch(e){made.forEach(([i,sid])=>{const p=P(i);if(p)p.sales=p.sales.filter(x=>x.id!==sid)});throw e}
   S.recent.unshift({made,t});S.recent.length=Math.min(S.recent.length,5);S.cart={};S.pay='';S.msg='✓ Logged '+money(t)})},
 undo(){const r=S.recent[0];if(!r)return;go(async()=>{const bak=[];r.made.forEach(([i,sid])=>{const p=P(i),x=p&&p.sales.find(y=>y.id===sid);if(x){bak.push([p,x]);p.sales=p.sales.filter(y=>y.id!==sid)}});
   try{await save()}catch(e){bak.forEach(([p,x])=>p.sales.push(x));throw e}S.recent.shift();S.msg='Undid '+money(r.t)})},
 csv(){const rows=[['Product','Labels','Date','Qty','Unit price','Total','Note']];W().data.products.forEach(p=>p.sales.forEach(s=>rows.push([p.name,p.labels.join('|'),s.d,s.q,s.p,s.q*s.p,s.n])));
  const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');dl(t,'sales.csv','text/csv')},
 json(){dl(JSON.stringify(W().data,null,2),'backup.json','application/json')}
};
const dl=(t,n,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};

/* ---- views ---- */
const st=p=>{const u=p.sales.reduce((a,s)=>a+s.q,0),rev=p.sales.reduce((a,s)=>a+s.q*s.p,0);return{u,rev,profit:rev-u*p.cost,last:p.sales.map(s=>s.d).sort().pop()||'',cur:(latest(p)||{}).p||0}};
const chips=l=>l.map(x=>`<span class="chip">${esc(x)}</span>`).join('');
const env=()=>{const m=[];if(!window.crypto||!crypto.subtle)m.push('Encryption is unavailable here — open this page over https:// or as a local file.');if(window.top!==window)m.push('This page is inside a preview frame, which usually blocks GitHub access. Download the file and open it in its own browser tab.');return m.map(x=>`<div class="msg">${x}</div>`).join('')};
function authV(){return`<h1>Sales Tracker</h1><p class="mu">Your data is encrypted in your browser before it is saved to GitHub.</p>${env()}${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}
<div class="card"><h2>GitHub storage</h2><div class="row"><input id="repo" placeholder="owner/private-repo" value="${esc(cfg.repo)}"><input id="br" placeholder="branch" size="8" value="${esc(cfg.branch)}"></div>
<div class="row" style="margin-top:8px"><input id="tok" class="sp" type="password" placeholder="Fine-grained token (Contents: read & write)" value="${esc(cfg.token)}"></div>
<label class="mu"><input type="checkbox" id="rem" ${cfg.token?'checked':''}> Remember token in this browser</label></div>
<div class="card"><h2>Account</h2><div class="row"><input id="usr" placeholder="username" value="${esc(S.u0||'')}"><input id="pas" type="password" placeholder="passphrase (8+ chars)" class="sp" onkeydown="if(event.key==='Enter')A.auth('in')"></div>
<div class="row" style="margin-top:10px"><button class="p" ${S.busy?'disabled':''} onclick="A.auth('in')">Sign in</button><button ${S.busy?'disabled':''} onclick="A.auth('up')">Create account</button>${S.busy?'<span class="mu">Working…</span>':''}</div>
<p class="mu">Lose your passphrase and your data cannot be recovered — there is no reset.</p></div>
<details class="card"><summary>Setup help</summary><ol class="mu"><li>Create a <b>private</b> repo (e.g. sales-data).</li><li>GitHub → Settings → Developer settings → Fine-grained tokens: select only that repo, permission <i>Contents: Read and write</i>.</li><li>To let others use the app, add them as collaborators and have each make their own token for the same repo.</li><li>Each person creates an account here; use ⤴ Share to give someone access to a collection.</li></ol></details>`}
function mainV(){const w=W(),pr=w.data.products;if(S.st)return saleV(w);
 const head=`<div class="row"><h1>${esc(w.data.name)}</h1><button class="l" onclick="A.rename()">✎</button><button class="p" onclick="A.stOn()">🛒 Sale Time</button><span class="sp"></span><span class="mu">${esc(S.user)}</span><button onclick="A.out()">Sign out</button></div>
 ${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}${S.busy?'<div class="mu">Saving…</div>':''}
 <div class="row"><select onchange="A.ws(this.value)">${S.wss.map((x,i)=>`<option value="${i}" ${i==S.cur?'selected':''}>${esc(x.data.name)}${x.owner!==S.user?' (from '+esc(x.owner)+')':''}</option>`).join('')}</select>
 <button onclick="A.newWs()">+ Collection</button><button onclick="A.share()">⤴ Share</button><span class="mu">Members: ${Object.keys(w.members).map(esc).join(', ')}</span></div>`;
 return head+(S.open&&P(S.open)?detailV(P(S.open)):listV(w,pr))}
function saleV(w){const pr=w.data.products,labs=[...new Set(pr.flatMap(p=>p.labels))].sort(),c=S.cart,ids=Object.keys(c).filter(i=>P(i)),t=today();
 const tot=ids.reduce((a,i)=>a+c[i].q*c[i].p,0),n=ids.reduce((a,i)=>a+c[i].q,0),ts=pr.flatMap(p=>p.sales).filter(x=>x.d===t),dr=ts.reduce((a,x)=>a+x.q*x.p,0),du=ts.reduce((a,x)=>a+x.q,0);
 const v=pr.filter(p=>!S.slab||p.labels.includes(S.slab)).sort((a,b)=>st(b).u-st(a).u||a.name.localeCompare(b.name));
 return`<div class="row"><button onclick="A.stOff()">← Exit</button><b>🛒 Sale Time</b><input class="sp" placeholder="Event name (optional)" value="${esc(S.ev)}" oninput="A.ev(this.value)">
 ${S.wss.length>1?`<select onchange="A.ws(this.value)">${S.wss.map((x,i)=>`<option value="${i}" ${i==S.cur?'selected':''}>${esc(x.data.name)}</option>`).join('')}</select>`:''}</div>
 <div class="st" style="margin:8px 0"><div><span class="mu">Today’s sales</span><b>${du} items</b></div><div><span class="mu">Today’s total</span><b>${money(dr)}</b></div></div>
 ${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}
 <div class="row" style="margin:8px 0"><button class="big ${!S.slab?'p':''}" onclick="A.slab('')">All</button>${labs.map(l=>`<button class="big ${S.slab===l?'p':''}" data-l="${esc(l)}" onclick="A.slab(this.dataset.l)">${esc(l)}</button>`).join('')}
 ${S.recent.length?`<span class="sp"></span><button class="big d" ${S.busy?'disabled':''} onclick="A.undo()">↩ Undo last (${money(S.recent[0].t)})</button>`:''}</div>
 <div class="grid">${v.map(p=>{const x=c[p.id],cur=st(p).cur;return`<button class="tile ${x?'on':''}" onclick="A.tap('${p.id}')"><b>${esc(p.name)}</b><span class="mu">${cur?money(cur):'no price set'}</span>${x?`<span class="badge">${x.q}</span>`:''}</button>`}).join('')||'<p class="mu">No products yet — add some first.</p>'}</div>
 ${ids.length?`<div class="cart card">${ids.map(i=>{const x=c[i];return`<div class="row"><span class="sp">${esc(P(i).name)}</span><button class="big" onclick="A.qty('${i}',-1)">−</button><b style="min-width:24px;text-align:center">${x.q}</b><button class="big" onclick="A.qty('${i}',1)">+</button><button class="big" onclick="A.cp('${i}')">${money(x.p)} ✎</button></div>`}).join('')}
 <div class="row" style="margin:8px 0"><span class="mu">Paid by</span>${['Cash','Card','Other'].map(m=>`<button class="big ${S.pay===m?'p':''}" onclick="A.pay('${m}')">${m}</button>`).join('')}<span class="sp"></span><button class="big" onclick="A.clr()">Clear</button></div>
 <button class="p big go" ${S.busy?'disabled':''} onclick="A.log()">Log sale · ${n} item${n>1?'s':''} · ${money(tot)}</button></div>`:''}`}
function listV(w,pr){const all=[...new Set(pr.flatMap(p=>p.labels))].sort(),tot=pr.map(st);
 const rev=tot.reduce((a,t)=>a+t.rev,0),prof=tot.reduce((a,t)=>a+t.profit,0),un=tot.reduce((a,t)=>a+t.u,0);
 const byL=all.map(l=>[l,pr.filter(p=>p.labels.includes(l)).reduce((a,p)=>a+st(p).rev,0)]);

 if(!pts.length)return'<p class="mu">No prices yet.</p>';const ts=pts.map(x=>+new Date(x.d)),mn=Math.min(...ts),mx=Math.max(...ts)||1,pv=pts.map(x=>x.p),lo=Math.min(...pv),hi=Math.max(...pv);
